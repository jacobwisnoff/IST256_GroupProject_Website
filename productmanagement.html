<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

    <!-- Header -->
    <header class="welcome-banner">
        <div class="container d-flex align-items-center justify-content-between py-3">
            <div class="brand d-flex align-items-center gap-3">
                <img class="brand-logo" src="images/storelogo.jpg" alt="Store Logo" width="72" height="72">
                <div>
                    <h1 class="brand-title mb-0">ShopSmart</h1>
                    <p class="brand-tagline mb-0">Curated deals, hassle-free shopping</p>
                </div>
            </div>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-light btn-sm" href="productmanagement.html">Product Management</a>
                <a class="btn btn-outline-light btn-sm" href="signup.html">Sign Up / Login</a>
            </div>
        </div>
    </header>

    <!-- Nav Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
        <div class="container">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 justify-content-center">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="signup.html">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Shopping Cart</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="productmanagement.html">Products</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact Us</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <section class="main-content mt-4">
        <div class="container d-flex justify-content-center">
            <div class="card shadow-sm" style="width:100%; max-width:520px;">
                <div class="card-body">
                    <h2 class="card-title text-center mb-3">Product Management</h2>
                    <form id="productForm" novalidate>
                        <div class="row mb-3">
                            <label for="productDescription" class="col-sm-4 col-form-label">Product Description <span class="text-danger">*</span></label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="productDescription" placeholder="Enter Product Description" required>
                                <div id="productDescriptionError" class="d-none text-danger small mt-1"></div>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <label for="productCategory" class="col-sm-4 col-form-label">Product Category <span class="text-danger">*</span></label>
                            <div class="col-sm-8">
                                <select class="form-select" id="productCategory" required>
                                    <option value="">Select Category</option>
                                    <option value="electronics">Electronics</option>
                                    <option value="clothing">Clothing</option>
                                    <option value="books">Books</option>
                                    <option value="home">Home & Garden</option>
                                    <option value="sports">Sports & Outdoors</option>
                                </select>
                                <div id="productCategoryError" class="d-none text-danger small mt-1"></div>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <label for="unitOfMeasure" class="col-sm-4 col-form-label">Unit of Measure <span class="text-danger">*</span></label>
                            <div class="col-sm-8">
                                <select class="form-select" id="unitOfMeasure" required>
                                    <option value="">Select Unit</option>
                                    <option value="pieces">Pieces</option>
                                    <option value="kilograms">Kilograms</option>
                                    <option value="liters">Liters</option>
                                    <option value="meters">Meters</option>
                                    <option value="boxes">Boxes</option>
                                </select>
                                <div id="unitOfMeasureError" class="d-none text-danger small mt-1"></div>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <label for="productPrice" class="col-sm-4 col-form-label">Product Price <span class="text-danger">*</span></label>
                            <div class="col-sm-8">
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="productPrice" step="0.01" min="0" placeholder="0.00" required>
                                </div>
                                <div id="productPriceError" class="d-none text-danger small mt-1"></div>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <label for="productWeight" class="col-sm-4 col-form-label">Product Weight (optional)</label>
                            <div class="col-sm-8">
                                <input type="number" class="form-control" id="productWeight" step="0.01" min="0" placeholder="0.00">
                            </div>
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary px-5">Submit</button>
                        </div>
                    </form>
                    <div class="mt-4" id="productResult" aria-live="polite"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Search Products Section -->
    <section class="main-content mt-4">
        <div class="container d-flex justify-content-center">
            <div class="card shadow-sm" style="width:100%; max-width:520px;">
                <div class="card-body">
                    <h2 class="card-title text-center mb-3">Search Products</h2>
                    <form id="searchForm" class="mb-4">
                        <div class="row mb-3">
                            <label for="searchDescription" class="col-sm-4 col-form-label">Description</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="searchDescription" placeholder="Search by description">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <label for="searchCategory" class="col-sm-4 col-form-label">Category</label>
                            <div class="col-sm-8">
                                <select class="form-select" id="searchCategory">
                                    <option value="">All Categories</option>
                                    <option value="electronics">Electronics</option>
                                    <option value="clothing">Clothing</option>
                                    <option value="books">Books</option>
                                    <option value="home">Home & Garden</option>
                                    <option value="sports">Sports & Outdoors</option>
                                </select>
                            </div>
                        </div>
                        <div class="text-center">
                            <button type="button" class="btn btn-primary px-5" id="searchBtn">Search</button>
                        </div>
                    </form>
                    <div id="searchResults" class="row"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="website-terms mt-5">
        <div class="container">
            <p><a href="">Terms of Use</a></p>
            <p><a href="">Cookie and Privacy Policy</a></p>
            <p><a href="">Copyright</a></p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>

</html>
